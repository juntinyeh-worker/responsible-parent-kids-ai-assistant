AWSTemplateFormatVersion: '2010-09-09'
Description: Child Voice Tutor - CloudFront + S3 + Cognito authentication

Parameters:
  ALBDnsName:
    Type: String
    Description: ALB DNS name from the ECS stack
  ALBOriginSecret:
    Type: String
    Default: cvt-cf-origin-verify-2026
    NoEcho: true
    Description: Shared secret header value to lock ALB to CloudFront only
  AdminEmail:
    Type: String
    Description: Email for the initial admin user in Cognito

Resources:
  # --- S3 Static Site Bucket ---
  StaticBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-static-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${StaticBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # --- Cognito User Pool ---
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: email
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AWS::StackName}-web'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  AdminUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref AdminEmail
      UserAttributes:
        - Name: email
          Value: !Ref AdminEmail
      DesiredDeliveryMediums:
        - EMAIL

  # --- Lambda@Edge for Cognito Auth ---
  # Must be in us-east-1 for Lambda@Edge, so we use a CloudFront Function instead
  AuthFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-auth'
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var cookies = parseCookies(request.headers.cookie);
          if (uri.startsWith('/api/') || uri.startsWith('/auth/')) { return request; }
          if (uri === '/login.html') { return request; }
          if (uri.match(/\.(js|css|svg|png|jpg|ico|woff2?)$/)) { return request; }
          if (cookies['cvt-authed'] === '1') { return request; }
          return { statusCode: 302, statusDescription: 'Found', headers: { location: { value: '/login.html' } } };
        }
        function parseCookies(h) {
          var c = {};
          if (!h || !h.value) return c;
          h.value.split(';').forEach(function(s) {
            var p = s.trim().split('=');
            if (p.length >= 2) c[p[0]] = p.slice(1).join('=');
          });
          return c;
        }
      FunctionConfig:
        Comment: Auth gate - redirect to login
        Runtime: cloudfront-js-2.0

  # --- CloudFront OAC ---
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # --- CloudFront Distribution ---
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: !Sub '${AWS::StackName} - CloudFront'
        HttpVersion: http2and3
        PriceClass: PriceClass_200

        Origins:
          # S3 origin for static files
          - Id: S3Origin
            DomainName: !GetAtt StaticBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''

          # ALB origin for API
          - Id: ALBOrigin
            DomainName: !Ref ALBDnsName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
            OriginCustomHeaders:
              - HeaderName: X-CF-Origin-Verify
                HeaderValue: !Ref ALBOriginSecret

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt AuthFunction.FunctionARN

        CacheBehaviors:
          # API routes → ALB (no caching)
          - PathPattern: /api/*
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3  # AllViewer

        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  CloudFrontDomainName:
    Description: CloudFront URL
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
  StaticBucketName:
    Value: !Ref StaticBucket
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoRegion:
    Value: !Ref AWS::Region
  ALBOriginSecret:
    Value: !Ref ALBOriginSecret
